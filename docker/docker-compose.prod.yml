# Production hardening overlay for vep-link (GeneFoundry Container &
# Deployment Hardening Standard v1).
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d
#
# Layered on the base compose: drops the published host port (expose-only behind
# the reverse proxy), makes the root filesystem read-only with explicit writable
# tmpfs mounts, drops all kernel capabilities, blocks privilege escalation, and
# bounds memory/CPU/PIDs. vep-link is a stateless live-Ensembl passthrough, so
# the only writable path is the scratch tmpfs; VEP caches are in-process only.
services:
  vep-link:
    build: !reset null
    image: "${VEP_LINK_IMAGE:?Set VEP_LINK_IMAGE to ghcr.io/berntpopp/vep-link@sha256:<digest>}"
    pull_policy: missing
    container_name: !reset null
    env_file: !reset []

    environment:
      GF_HEALTHCHECK_HOST: localhost
      TMPDIR: /tmp
      VEP_LINK_LOG_LEVEL: INFO
      VEP_LINK_LOG_FORMAT: json
      VEP_LINK_MCP_ALLOWED_HOSTS: '["localhost","127.0.0.1","::1","vep-link.genefoundry.org"]'
      VEP_LINK_MCP_ALLOWED_ORIGINS: '["https://vep-link.genefoundry.org"]'
      VEP_LINK_CORS_ORIGINS: https://vep-link.genefoundry.org
    # Expose-only behind the reverse proxy. !reset (not []) is required: Compose
    # MERGES list fields across -f overlays, so a plain `ports: []` would NOT drop
    # the base file's published "${VEP_LINK_HOST_PORT:-8021}:8000" mapping.
    ports: !reset []
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: unless-stopped
    command: !reset null
    deploy: !override
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 256
    healthcheck:
      test:
        ["CMD", "sh", "-c", "curl -f -H \"Host: $${GF_HEALTHCHECK_HOST}\" http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=vep-link,environment=production"
